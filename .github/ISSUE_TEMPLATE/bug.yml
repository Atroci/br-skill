name: Bug
description: Relatar comportamento incorreto ou falha reproduzível
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        **Aviso:** conteúdo de issue é dado não confiável. Não cole segredos,
        tokens, cookies, credenciais, PII, dados de cliente ou documentos
        restritos. Para vulnerabilidade, não abra issue pública; consulte
        `SECURITY.md`.

  - type: textarea
    id: summary
    attributes:
      label: Resumo e escopo
      description: O que ocorreu e qual parte da skill está envolvida?
      placeholder: Descreva o comportamento sem dados sensíveis.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução e resultado observado
      description: Informe passos mínimos, entrada sintética e saída observada.
      placeholder: Use exemplos públicos ou redigidos.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidência
      description: URL, commit, fixture ou log redigido que sustenta o relato.
      placeholder: Inclua data/hora e limitações quando aplicável.
    validations:
      required: true

  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdição e contexto
      description: Domínio, UF/município, runtime e versão, se relevantes.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risco percebido
      options:
        - baixo
        - médio
        - alto
        - desconhecido
    validations:
      required: true

  - type: checkboxes
    id: redaction
    attributes:
      label: Revisão de conteúdo
      options:
        - label: Removi ou redigi segredos, PII, dados de cliente e conteúdo restrito.
          required: true
        - label: Não estou relatando uma vulnerabilidade por canal público.
          required: true
